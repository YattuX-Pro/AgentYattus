# PostgreSQL de développement uniquement : sans mot de passe (trust), joignable seulement depuis la machine.
# Port 5432 déjà pris : POSTGRES_PORT=5434 docker compose up, et ConnectionStrings__AgentYattus avec Port=5434.
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: agentyattus
      POSTGRES_DB: agentyattus
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentyattus"]
      interval: 5s
      retries: 10

  # Fournisseur d'identité (OpenID Connect). Développement seulement : HTTP, base intégrée, comptes de test.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--http-port=8380", "--spi-theme--cache-themes=false", "--spi-theme--cache-templates=false"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
    volumes:
      - ./deploy/keycloak/agent-yattus-realm.json:/opt/keycloak/data/import/agent-yattus-realm.json:ro
      # Thème de connexion aux couleurs de l'admin (cache désactivé : une retouche se voit au rechargement).
      - ./deploy/keycloak/themes/agent-yattus:/opt/keycloak/themes/agent-yattus:ro
    ports:
      - "127.0.0.1:8380:8380"

  # Tableau de bord des traces et métriques (OpenTelemetry) : http://localhost:18888
  # Sans authentification, donc joignable seulement depuis la machine.
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.5.2
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      - "127.0.0.1:18888:18888"
      - "127.0.0.1:4317:18889"

volumes:
  postgres-data:
