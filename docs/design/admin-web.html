<style>
/* Layout : barre supérieure flottante, pages en grille dense de panneaux ; une seule teinte d'accent (vert-de-gris), laiton = décision humaine, cinabre = échec. */
:root {
  --bg: #0E0F11; --panel: #131417; --raised: #181A1E; --line: #24272B; --line-2: #2E3237;
  --ink: #ECE6D8; --ink-2: #A7A196; --ink-3: #8C877C;
  --accent: #5E9E92; --accent-soft: rgba(94,158,146,.14);
  --brass: #D8B86E; --brass-soft: rgba(216,184,110,.13);
  --red: #D9654B; --red-soft: rgba(217,101,75,.13);
  --shadow: 0 10px 40px rgba(0,0,0,.45); --on-accent: #0B1412;
  --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) {
  --bg: #F6F7F5; --panel: #FFFFFF; --raised: #F1F2F0; --line: #DCDFDB; --line-2: #CBD0CB;
  --ink: #16181B; --ink-2: #4F5458; --ink-3: #6E7377;
  --accent: #33796D; --accent-soft: rgba(51,121,109,.11);
  --brass: #94701F; --brass-soft: rgba(148,112,31,.12);
  --red: #B9452C; --red-soft: rgba(185,69,44,.10);
  --shadow: 0 10px 40px rgba(20,24,28,.14); --on-accent: #FFFFFF; color-scheme: light; } }
:root[data-theme="light"] {
  --bg: #F6F7F5; --panel: #FFFFFF; --raised: #F1F2F0; --line: #DCDFDB; --line-2: #CBD0CB;
  --ink: #16181B; --ink-2: #4F5458; --ink-3: #6E7377;
  --accent: #33796D; --accent-soft: rgba(51,121,109,.11);
  --brass: #94701F; --brass-soft: rgba(148,112,31,.12);
  --red: #B9452C; --red-soft: rgba(185,69,44,.10);
  --shadow: 0 10px 40px rgba(20,24,28,.14); --on-accent: #FFFFFF; color-scheme: light; }

* { box-sizing: border-box; scrollbar-width: thin; scrollbar-color: var(--line-2) transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 999px; border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background-color: var(--ink-3); }
::-webkit-scrollbar-corner { background: transparent; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); } .faint { color: var(--ink-3); }

/* Menu latéral fixe + colonne de contenu */
.side { position: fixed; z-index: 25; top: 0; bottom: 0; left: 0; width: 240px; display: flex; flex-direction: column; background: var(--panel); border-right: 1px solid var(--line); padding: calc(14px + env(safe-area-inset-top, 0px)) 12px calc(12px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.shell { margin-left: 240px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; padding: 2px 8px 14px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.brand svg { width: 22px; height: 22px; color: var(--accent); }
.tag { font: 500 10px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); border: 1px solid var(--line-2); border-radius: 4px; padding: 3px 5px; margin-left: auto; }
.nav { display: flex; flex-direction: column; gap: 1px; overflow-y: auto; flex: 1; min-height: 0; }
.nav .group { display: flex; align-items: center; justify-content: space-between; width: 100%; border: 0; background: none; border-radius: 6px; font: 500 10.5px/1 var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding: 9px 10px; margin-top: 6px; }
.nav .group:first-child { margin-top: 0; }
.nav .group:hover { color: var(--ink); }
.nav .group .chev { transition: transform .15s; }
.nav .group[aria-expanded="false"] .chev { transform: rotate(-90deg); }
.nav .group .hint { margin-left: auto; margin-right: 8px; font: 500 10px/1 var(--mono); color: var(--brass); letter-spacing: 0; }
.nav .items { display: flex; flex-direction: column; gap: 1px; }
.org { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 9px; background: var(--raised); text-align: left; }
.org .logo { width: 26px; height: 26px; border-radius: 7px; display: grid; place-items: center; font-weight: 700; font-size: 11px; background: var(--accent-soft); color: var(--accent); flex: none; }
.org .main { flex: 1; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--raised); gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
tr.sel td { background: var(--accent-soft); }
.nav a { position: relative; display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-weight: 500; white-space: nowrap; }
.nav a:hover { color: var(--ink); background: var(--raised); }
.nav a[aria-current="page"] { color: var(--ink); background: var(--raised); box-shadow: inset 0 0 0 1px var(--line-2); }
.nav a[aria-current="page"] svg { color: var(--accent); }
.nav .count { margin-left: auto; font: 500 10px/1 var(--mono); padding: 3px 5px; border-radius: 4px; background: var(--brass-soft); color: var(--brass); }
.me { display: flex; align-items: center; gap: 10px; padding: 10px 8px 2px; border-top: 1px solid var(--line); margin-top: 10px; }
.me .main { min-width: 0; flex: 1; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; gap: 12px; height: 54px; padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 16px; }
.crumb { display: flex; align-items: center; gap: 8px; color: var(--ink-3); white-space: nowrap; min-width: 0; flex: 1; }
.crumb b { color: var(--ink); font-weight: 600; }
.seg.theme button { display: grid; place-items: center; width: 28px; height: 26px; padding: 0; }
.menu-btn { display: none; width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--raised); place-items: center; flex: none; }
.side-scrim { display: none; }
.right { display: flex; align-items: center; gap: 8px; }
.search { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--raised); color: var(--ink-3); width: 210px; }
.search input { border: 0; background: none; outline: none; width: 100%; color: var(--ink); }
.kbd { font: 500 10px/1 var(--mono); border: 1px solid var(--line-2); border-radius: 4px; padding: 3px 4px; }
.avatar { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 11px; background: var(--raised); border: 1px solid var(--line-2); flex: none; }

/* Page */
main { padding: 14px max(16px, env(safe-area-inset-right, 0px)) 24px max(16px, env(safe-area-inset-left, 0px)); }
.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
.head h1 { font-size: 22px; line-height: 1.15; font-weight: 600; letter-spacing: -.02em; margin: 0; text-wrap: balance; }
.head p { margin: 3px 0 0; color: var(--ink-2); }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line-2); background: var(--raised); font-weight: 500; white-space: nowrap; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { height: 26px; padding: 0 9px; font-size: 12px; border-radius: 6px; }
.btn.ok { color: var(--accent); } .btn.no { color: var(--red); }

.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 10px; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; } .s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s9 { grid-column: span 9; } .s12 { grid-column: span 12; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; min-width: 0; display: flex; flex-direction: column; }
.ph { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 14px; border-bottom: 1px solid var(--line); min-height: 44px; }
.ph h2 { margin: 0; font-size: 13px; font-weight: 600; }
.ph .sub { color: var(--ink-3); font-size: 12px; }
.pb { padding: 12px 14px; }
.label { font: 500 10.5px/1 var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }

/* Bandeau d'indicateurs */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
.kpi { padding: 13px 14px 11px; border-left: 1px solid var(--line); display: grid; gap: 6px; min-width: 0; }
.kpi:first-child { border-left: 0; }
.kpi .v { font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .v small { font-size: 13px; color: var(--ink-3); font-weight: 500; }
.kpi .d { display: flex; justify-content: space-between; align-items: end; gap: 6px; font-size: 11.5px; color: var(--ink-3); }
.up { color: var(--accent); } .down { color: var(--red); }
.spark { width: 64px; height: 22px; flex: none; }

/* Tableaux */
.tw { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font: 500 10.5px/1 var(--sans); letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--panel); }
td { padding: 9px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
tbody tr.click { cursor: pointer; }
tbody tr:hover td { background: var(--raised); }
td.wrap { white-space: normal; min-width: 240px; }
.r { text-align: right; }

/* États */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; background: var(--raised); color: var(--ink-2); border: 1px solid var(--line); }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill.run { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
.pill.run::before { animation: pulse 1.6s infinite; }
.pill.wait { color: var(--brass); background: var(--brass-soft); border-color: transparent; }
.pill.fail { color: var(--red); background: var(--red-soft); border-color: transparent; }
.pill.done { color: var(--ink-2); }
.pill.done::before { background: var(--accent); }
.pill.plain::before { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--ink-2); font-weight: 500; font-size: 12px; white-space: nowrap; }
.chip b { font: 500 11px/1 var(--mono); color: var(--ink-3); }
.chip[aria-pressed="true"] { color: var(--ink); border-color: var(--line-2); background: var(--raised); }
.chip[aria-pressed="true"] b { color: var(--accent); }
.tool { display: inline-flex; align-items: center; gap: 5px; font: 12px/1 var(--mono); padding: 5px 7px; border-radius: 5px; background: var(--raised); border: 1px solid var(--line); color: var(--ink-2); white-space: nowrap; }
.tool.guard { color: var(--brass); border-color: var(--brass-soft); background: var(--brass-soft); }
.dash { border: 1px dashed var(--ink-3); background: transparent; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .pill.run::before { animation: none; } * { transition: none !important; } }

.toolbar { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.toolbar .grow { flex: 1; }
.field { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border: 1px solid var(--line); border-radius: 7px; background: var(--raised); color: var(--ink-3); min-width: 0; }
.field input, .field select { border: 0; background: none; outline: none; color: var(--ink); width: 100%; min-width: 0; }
.field select option { background: var(--panel); }

/* Listes */
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--line); min-width: 0; }
.row:last-child { border-bottom: 0; }
.row .main { flex: 1; min-width: 0; }
.row .t { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .m { color: var(--ink-3); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-track { height: 6px; border-radius: 3px; background: var(--raised); border: 1px solid var(--line); overflow: hidden; }
.bar-fill { height: 100%; background: var(--accent); border-radius: 3px; }
.bar-fill.brass { background: var(--brass); } .bar-fill.red { background: var(--red); } .bar-fill.ghost { background: var(--ink-3); }

/* Graphique */
.chart { width: 100%; height: 210px; display: block; }
.legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

/* Journal */
.log { font: 12px/1.5 var(--mono); }
.log .row { gap: 10px; padding: 7px 14px; }
.ev { color: var(--ink); }
.ev.k-bascule { color: var(--brass); } .ev.k-approbation { color: var(--brass); } .ev.k-echec { color: var(--red); } .ev.k-outil { color: var(--accent); }

/* Agents */
.agent { display: grid; grid-template-columns: 1fr; }
.agent .top-a { display: flex; gap: 12px; align-items: center; padding: 14px; border-bottom: 1px solid var(--line); }
.orb { width: 38px; height: 38px; border-radius: 50%; flex: none; display: grid; place-items: center; background: radial-gradient(circle at 35% 30%, var(--accent), transparent 70%), var(--raised); border: 1px solid var(--line-2); }
.orb.b { background: radial-gradient(circle at 35% 30%, var(--brass), transparent 70%), var(--raised); }
.kv { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-bottom: 1px solid var(--line); }
.kv > div { padding: 10px 14px; border-left: 1px solid var(--line); display: grid; gap: 5px; min-width: 0; }
.kv > div:first-child { border-left: 0; }
.kv b { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
.prompt { font: 12px/1.6 var(--mono); color: var(--ink-2); background: var(--raised); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin: 0; white-space: pre-wrap; }

/* Matrice des droits */
.matrix td, .matrix th { text-align: center; }
.matrix td:first-child, .matrix th:first-child { text-align: left; }
.yes { color: var(--accent); font-weight: 600; } .no-p { color: var(--ink-3); }

/* Réglages */
.set { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 11px 14px; border-bottom: 1px solid var(--line); }
.set:last-child { border-bottom: 0; }
.set .main { min-width: 0; }
.set .t { font-weight: 500; }
.set .m { color: var(--ink-3); font-size: 12px; }
.set .field { width: 180px; flex: none; }
.switch { position: relative; width: 34px; height: 20px; flex: none; border-radius: 999px; border: 1px solid var(--line-2); background: var(--raised); padding: 0; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--ink-3); transition: transform .15s; }
.switch[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(14px); background: var(--on-accent); }

/* Panneau latéral de détail */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.35); }
.drawer { position: fixed; z-index: 41; top: calc(10px + env(safe-area-inset-top, 0px)); right: calc(10px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); width: min(460px, calc(100% - 20px)); background: var(--panel); border: 1px solid var(--line-2); border-radius: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; overflow: hidden; }
.drawer .body { overflow-y: auto; flex: 1; }
.steps { position: relative; padding: 4px 14px 14px; }
.step { display: grid; grid-template-columns: 54px 14px 1fr; gap: 10px; align-items: start; padding: 7px 0; }
.step .h { font: 11.5px/1.4 var(--mono); color: var(--ink-3); text-align: right; }
.dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; background: var(--accent); }
.dot.brass { background: var(--brass); } .dot.red { background: var(--red); } .dot.hollow { background: transparent; border: 1.5px dashed var(--ink-3); }

.toast { position: fixed; z-index: 50; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--raised); border: 1px solid var(--line-2); box-shadow: var(--shadow); padding: 9px 14px; border-radius: 9px; font-weight: 500; }

@media (max-width: 1180px) {
  .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .kpi:nth-child(4) { border-left: 0; } .kpi:nth-child(n+4) { border-top: 1px solid var(--line); }
  .s3, .s4, .s5 { grid-column: span 6; } .s7, .s8, .s9 { grid-column: span 12; }
  .search { width: 150px; }
}
@media (max-width: 760px) {
  .s3, .s4, .s5, .s6 { grid-column: span 12; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kpi { border-left: 1px solid var(--line) !important; border-top: 1px solid var(--line); }
  .kpi:nth-child(odd) { border-left: 0 !important; } .kpi:nth-child(-n+2) { border-top: 0; }
  .search, .brand .tag { display: none; }
  .bar { gap: 8px; }
  .kv { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .kv > div:nth-child(3) { border-left: 0; } .kv > div:nth-child(n+3) { border-top: 1px solid var(--line); }
  .set { flex-wrap: wrap; } .set .field { width: 100%; }
  .top .pill { display: none; }
}
@media (max-width: 960px) {
  .shell { margin-left: 0; }
  .side { transform: translateX(-100%); transition: transform .2s; box-shadow: var(--shadow); }
  body.menu-open .side { transform: none; }
  body.menu-open .side-scrim { display: block; position: fixed; inset: 0; z-index: 24; background: rgba(0,0,0,.35); }
  .menu-btn { display: grid; }
  .bar { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); }
}
</style>

    <section class="panel s12"><div class="kpis">${[['Comptes', '6', '1 invitation'], ['Administrateurs', '2', 'MFA 100 %'], ['Sessions ouvertes', '5', 'Bureau 3 · Mobile 2'], ['Actifs, 7 j', '4', 'sur 5 comptes actifs'], ['Sans MFA', '2', '<span class="down">à relancer</span>'], ['Missions, 30 j', '808', 'par 4 personnes']].map(([l, v, d]) => `<div class="kpi"><span class="label">${l}</span><span class="v">${v}</span><div class="d"><span>${d}</span></div></div>`).join('')}</div></section>
    <section class="panel s8"><div class="toolbar"><button class="chip" aria-pressed="true">Tous <b>6</b></button><button class="chip">Administrateurs <b>2</b></button><button class="chip">Opérateurs <b>3</b></button><button class="chip">Observateurs <b>1</b></button></div>
      <div class="tw"><table><thead><tr><th>Personne</th><th>Rôle</th><th>Apps</th><th class="r">Missions</th><th>MFA</th><th>Dernière activité</th><th>Statut</th><th></th></tr></thead>
      <tbody>${users.map(u => `<tr><td><div style="display:flex;align-items:center;gap:10px"><div class="avatar">${u.i}</div><div><div style="font-weight:500">${u.n}</div><div class="mono faint">${u.u}</div></div></div></td>
        <td><span class="pill ${rc(u.role)} plain">${u.role}</span></td><td class="muted">${u.clients}</td><td class="r num">${u.m}</td>
        <td>${u.mfa ? '<span class="up">Activée</span>' : '<span class="down">Absente</span>'}</td><td class="muted">${u.last}</td>
        <td>${u.st === 'Actif' ? '<span class="pill done">Actif</span>' : '<span class="pill wait">Invitée</span>'}</td><td class="r"><button class="btn sm" data-toast="Fiche de ${u.n}">Gérer</button></td></tr>`).join('')}</tbody></table></div></section>
    <section class="panel s4"><div class="ph"><h2>Rôles et droits</h2></div>
      <div class="tw"><table class="matrix"><thead><tr><th>Droit</th><th>Admin</th><th>Opér.</th><th>Obs.</th></tr></thead>
      <tbody>${perms.map(p => `<tr><td style="white-space:normal">${p[0]}</td>${p.slice(1).map(v => `<td class="${v ? 'yes' : 'no-p'}">${v ? '✓' : '—'}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
      <div class="pb" style="border-top:1px solid var(--line)"><div class="muted" style="font-size:12px">Le bureau et le mobile servent à travailler : lancer, suivre, approuver. Seuls les administrateurs entrent ici.</div></div></section>
  </div>`;
}

// Audit
let aFilter = 'tous';
function auditView() {
  const kinds = ['tous', 'mission', 'modele', 'outil', 'bascule', 'approbation', 'echec', 'admin'];
  const list = audit.filter(a => aFilter === 'tous' || a[3] === aFilter);
  return `
  <div class="head"><div><h1>Audit</h1><p>Chaque action d’agent et d’administrateur, horodatée, en ajout seul.</p></div>
    <div class="actions"><div class="field" style="width:150px"><select id="arange" aria-label="Période"><option>Aujourd’hui</option><option>7 jours</option><option>30 jours</option></select></div><button class="btn" data-toast="Export CSV préparé côté API">Exporter</button></div></div>
  <section class="panel"><div class="toolbar">${kinds.map(t => `<button class="chip" data-afilter="${t}" aria-pressed="${aFilter === t}">${t === 'tous' ? 'Tous' : t} <b>${t === 'tous' ? audit.length : audit.filter(a => a[3] === t).length}</b></button>`).join('')}</div>
    <div class="tw" style="min-width:0"><div style="min-width:720px">${list.length ? logRows(list) : '<div class="pb muted">Aucun événement de ce type aujourd’hui.</div>'}</div></div></section>`;
}

// Réglages
function configView() {
  const sw = (id, on) => `<button class="switch" id="${id}" role="switch" aria-checked="${on}"></button>`;
  const inp = (id, v, mono) => `<label class="field"><input id="${id}" value="${esc(v)}" ${mono ? 'class="mono"' : ''}></label>`;
  const group = (title, sub, rows, span = 's6') => `<section class="panel ${span}"><div class="ph"><h2>${title}</h2><span class="sub">${sub}</span></div>${rows.map(([t, m, c]) => `<div class="set"><div class="main"><div class="t">${t}</div><div class="m">${m}</div></div>${c}</div>`).join('')}</section>`;
  return `
  <div class="head"><div><h1>Réglages</h1><p>Valeurs appliquées à toutes les missions de l’instance.</p></div>
    <div class="actions"><button class="btn" data-toast="Modifications annulées">Annuler</button><button class="btn primary" data-toast="Réglages enregistrés">Enregistrer</button></div></div>
  <div class="grid">
    ${group('Exécution', 'par mission', [
      ['Tours maximum', 'Au-delà, la mission s’arrête : limite-de-tours', inp('turns', '10')],
      ['Missions simultanées', 'Places du worker', inp('slots', '4')],
      ['Durée maximum', 'Arrêt automatique', inp('maxdur', '15 min')],
      ['Approbation des écritures', 'write_file attend toujours une décision humaine', sw('appr', true)],
    ])}
    ${group('Budget', 'novembre', [
      ['Plafond mensuel', '4,82 $ dépensés · 24 %', inp('budget', '20 $')],
      ['Alerte', 'Notification aux administrateurs', inp('alert', '80 %')],
      ['Bloquer au plafond', 'Les missions payantes passent en file', sw('block', true)],
      ['Mode Gratuit par défaut', 'Pour les nouveaux rôles', sw('freedef', true)],
    ])}
    ${group('Espace de travail', 'bac à sable', [
      ['Dossier', 'Lecture seule pour les agents', inp('ws', '~/repos/agent-yattus', true)],
      ['Exclusions', 'Jamais lus par un agent', inp('excl', '.env, secrets.json, *.pfx', true)],
      ['Taille max d’un fichier lu', 'Au-delà, tronqué', inp('fmax', '256 Ko')],
    ])}
    ${group('Sécurité', 'serveur', [
      ['Rétention de l’audit', 'Puis archivage', inp('ret', '90 jours')],
      ['Hôtes autorisés', 'L’API reste sur la boucle locale', inp('hosts', 'localhost;127.0.0.1;[::1]', true)],
      ['Données sensibles dans les traces', 'Prompts et réponses exclus d’OpenTelemetry', sw('sens', false)],
    ])}
    ${group('Identité', 'Keycloak 26', [
      ['Autorité', 'Émetteur des jetons', inp('auth', 'http://localhost:8380/realms/agent-yattus', true)],
      ['MFA obligatoire', 'Pour les administrateurs', sw('mfa', true)],
    ])}
    ${group('Catalogue et télémétrie', 'services', [
      ['Source du catalogue', 'Rafraîchi chaque jour', inp('cat', 'https://models.dev/api.json', true)],
      ['Export OTLP', 'Tableau de bord Aspire', inp('otlp', 'http://localhost:4317', true)],
    ])}
  </div>`;
}

const VIEWS = { overview, projects: projectsView, org: orgView, missions: missionsView, agents: agentsView, models: modelsView, users: usersView, audit: auditView, config: configView };
let toastTimer;
function toast(msg) {
  let t = $('#toast');
  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); }
  t.textContent = msg; t.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 2200);
}
function route() {
  const r = VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'overview';
  $('#nav').innerHTML = NAV.map(([g, items]) => `<button class="group" data-group="${g}" aria-expanded="${!!openGroups[g]}">${g}${!openGroups[g] && g === 'Pilotage' ? '<span class="hint">3</span>' : ''}<svg class="chev" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div class="items" ${openGroups[g] ? '' : 'hidden'}>` + items.map(([id, l]) => `<a href="#${id}" ${id === r ? 'aria-current="page"' : ''}>${svg(icon[id], 16)}${l}${id === 'missions' ? '<span class="count">3</span>' : ''}</a>`).join('') + '</div>').join('');
  const [, label, group] = ROUTES.find(x => x[0] === r);
  $('#crumb').innerHTML = `<span>${group}</span><span>/</span><b>${label}</b>`;
  document.body.classList.remove('menu-open');
  render(r);
}
function render(r = (VIEWS[location.hash.slice(1)] ? location.hash.slice(1) : 'overview')) {
  const focus = document.activeElement?.id, pos = document.activeElement?.selectionStart;
  $('#view').innerHTML = VIEWS[r]();
  if (focus && document.getElementById(focus)) { const el = document.getElementById(focus); el.focus(); if (pos != null && el.setSelectionRange) el.setSelectionRange(pos, pos); }
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-mission],[data-close],[data-toast],[data-mfilter],[data-afilter],[data-group],[data-proj],[data-vis],#free,#freeonly,.switch');
  if (!t) return;
  if (t.dataset.group) {
    const g = t.dataset.group; openGroups[g] = !openGroups[g];
    try { localStorage.setItem('navGroups', JSON.stringify(openGroups)); } catch {}
    t.setAttribute('aria-expanded', openGroups[g]); t.nextElementSibling.hidden = !openGroups[g];
    const hint = t.querySelector('.hint'); if (hint) hint.remove();
    if (!openGroups[g] && g === 'Pilotage') t.querySelector('.chev').insertAdjacentHTML('beforebegin', '<span class="hint">3</span>');
    return;
  }
  if (t.dataset.proj) { selProj = t.dataset.proj; newVis = null; render(); return; }
  if (t.dataset.vis) { newVis = t.dataset.vis; render(); toast('Visibilité : ' + VIS[newVis][0]); return; }
  if (t.dataset.toast) { toast(t.dataset.toast); return; }
  if (t.dataset.mission) { $('#layer').innerHTML = missionDrawer(t.dataset.mission); $('#layer .drawer [data-close]').focus(); return; }
  if (t.hasAttribute('data-close')) { $('#layer').innerHTML = ''; return; }
  if (t.dataset.mfilter) { mFilter = t.dataset.mfilter; render(); return; }
  if (t.dataset.afilter) { aFilter = t.dataset.afilter; render(); return; }
  if (t.id === 'free') { freeOn = !freeOn; render(); toast(freeOn ? 'Mode Gratuit activé' : 'Mode Gratuit désactivé'); return; }
  if (t.id === 'freeonly') { freeOnly = !freeOnly; render(); return; }
  if (t.classList.contains('switch')) t.setAttribute('aria-checked', t.getAttribute('aria-checked') !== 'true');
});
document.addEventListener('input', e => {
  if (e.target.id === 'mq') { mQuery = e.target.value.toLowerCase(); render(); }
  if (e.target.id === 'cq') { cQuery = e.target.value.toLowerCase(); render(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('#layer').innerHTML = '';
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); }
});
$('#q').addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.value) { mQuery = e.target.value.toLowerCase(); mFilter = 'all'; location.hash = 'missions'; render('missions'); } });
$('#menu').addEventListener('click', () => document.body.classList.add('menu-open'));
$('#sidescrim').addEventListener('click', () => document.body.classList.remove('menu-open'));
window.addEventListener('hashchange', () => { $('#layer').innerHTML = ''; route(); window.scrollTo(0, 0); });
// Thème : clair, sombre, ou comme le système (aucun attribut).
function setTheme(t) {
  if (t === 'system') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('[data-theme-set]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeSet === t));
  try { localStorage.setItem('theme', t); } catch {}
}
$('#theme').addEventListener('click', e => { const b = e.target.closest('[data-theme-set]'); if (b) setTheme(b.dataset.themeSet); });
let savedTheme = 'system';
try { savedTheme = localStorage.getItem('theme') || 'system'; } catch {}
setTheme(savedTheme);
route();
</script>
