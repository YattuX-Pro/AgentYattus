name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # ponytail: le projet Mobile (MAUI) est exclu : il demande le workload maui et un SDK Android.
      # Ajouter un job macOS ou Android dédié quand l'APK devra être produit par la CI.
      - run: dotnet build tests/AgentYattus.Api.Tests
      - run: dotnet build tests/AgentYattus.Client.Core.Tests
      - run: dotnet build src/AgentYattus.Desktop
      - run: dotnet build spikes/AgentLoop.Tests
      - run: dotnet build evals/AgentYattus.Evals
      - run: dotnet test --project tests/AgentYattus.Api.Tests --no-build
      - run: dotnet test --project tests/AgentYattus.Client.Core.Tests --no-build
      - run: dotnet test --project spikes/AgentLoop.Tests --no-build
      # Notation et coûts seulement : l'évaluation sur de vrais modèles est ignorée sans AGENTYATTUS_EVAL_MODELS.
      - run: dotnet test --project evals/AgentYattus.Evals --no-build

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AgentYattus.Admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/AgentYattus.Admin/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false
