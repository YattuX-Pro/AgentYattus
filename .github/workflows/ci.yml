name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build tests/AgentYattus.Api.Tests
      - run: dotnet build tests/AgentYattus.Client.Core.Tests
      - run: dotnet build src/AgentYattus.Desktop
      - run: dotnet build spikes/AgentLoop.Tests
      - run: dotnet build evals/AgentYattus.Evals
      - run: dotnet test --project tests/AgentYattus.Api.Tests --no-build
      - run: dotnet test --project tests/AgentYattus.Client.Core.Tests --no-build
      - run: dotnet test --project spikes/AgentLoop.Tests --no-build
      # Notation et coûts seulement : l'évaluation sur de vrais modèles est ignorée sans AGENTYATTUS_EVAL_MODELS.
      - run: dotnet test --project evals/AgentYattus.Evals --no-build
